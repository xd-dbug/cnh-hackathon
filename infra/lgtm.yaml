# Grafana LGTM (Loki, Grafana, Tempo, Prometheus/Mimir + its own OTLP receiver) in one pod,
# namespace `observability`. Dev only: data lives in an emptyDir and is lost on restart.
# The Collector in `otel` forwards everything here; Grafana is on localhost:3000 (admin / admin).
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: observability
  labels: { app.kubernetes.io/name: lgtm }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: lgtm } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: lgtm }
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.39.0
          ports:
            - { name: grafana, containerPort: 3000 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe:
            httpGet: { path: /api/health, port: grafana }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: observability
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: lgtm }
  ports:
    - { name: grafana, port: 3000, targetPort: grafana, nodePort: 30300 }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
