# Receives OTLP from the API and worker and forwards it to Grafana LGTM in `observability`.
# No credentials: everything stays inside the cluster.
mode: deployment
replicaCount: 1
resources:
  limits:
    memory: 512Mi
image:
  repository: otel/opentelemetry-collector-contrib
presets:
  kubernetesAttributes:
    enabled: false
service:
  type: NodePort
ports:
  otlp:
    enabled: true
    nodePort: 30417
  otlp-http:
    enabled: true
    nodePort: 30418
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  exporters:
    debug: {}
    otlp_grpc/lgtm:
      endpoint: lgtm.observability.svc.cluster.local:4317
      tls:
        insecure: true
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/lgtm, debug]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/lgtm, debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/lgtm, debug]
