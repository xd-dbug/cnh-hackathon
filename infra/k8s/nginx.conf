server {
  listen 80;
  root /usr/share/nginx/html;

  # /api/talks → http://api:3001/talks. Same origin as the page, so the API's CORS rule doesn't apply.
  location /api/ {
    proxy_pass http://api.clash.svc.cluster.local:3001/;
    proxy_set_header Host $host;
    proxy_set_header traceparent $http_traceparent;
  }

  location / {
    try_files $uri /index.html;
  }
}
